# Full local stack for the render-agents monorepo. Builds every package into one
# image and runs the canonical two-lane topology against Postgres:
#
#   postgres     — event log + projections + the chat run_jobs queue
#   gateway      — web front door + SSE; enqueues chat turns, triggers workflows
#   chat-worker  — Lane B: drains run_jobs, drives interactive turns in-process
#   workflows    — Lane A: the Render Workflows host image (idles locally)
#
# Usage:
#   cp .env.example .env        # add ANTHROPIC_API_KEY / OPENAI_API_KEY to run agents
#   docker compose up --build
#   open http://localhost:3000/ui   (API key: RENDER_AGENTS_API_KEY, default dev-key)

x-app-env: &app-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/agents
  RENDER_AGENTS_API_KEY: ${RENDER_AGENTS_API_KEY:-dev-key}
  RENDER_AGENTS_ENCRYPTION_KEY: ${RENDER_AGENTS_ENCRYPTION_KEY:-dev-only-change-me-0000000000000000}
  RENDER_AGENTS_STRICT_APPROVAL: ${RENDER_AGENTS_STRICT_APPROVAL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agents
    # Host port is only for your own access; the app services connect over the
    # Docker network at postgres:5432. Override with POSTGRES_HOST_PORT if 5433
    # is taken too.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    image: render-agents-demo:latest
    command: ["pnpm", "--filter", "@render-agents/example-demo", "start"]
    # Operator UI / API on the host. Container always listens on 3000; override
    # the host side with GATEWAY_HOST_PORT if 3010 is taken.
    ports:
      - "${GATEWAY_HOST_PORT:-3010}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "3000"
      # Enqueue chat turns so the chat-worker drains them (mirrors production).
      RENDER_AGENTS_EXECUTION_MODE: queue

  chat-worker:
    build: .
    image: render-agents-demo:latest
    command: ["pnpm", "--filter", "@render-agents/example-demo", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env

  workflows:
    build: .
    image: render-agents-demo:latest
    command: ["pnpm", "--filter", "@render-agents/example-demo", "workflows"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env

volumes:
  pgdata:
