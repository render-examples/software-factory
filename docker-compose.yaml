# Full local stack for the render-factory monorepo.
#
#   postgres     — event log + projections
#   gateway      — web front door; dispatches all agent work to the workflows host
#   workflows    — Render Workflows host: runs chat turns, spec-to-pr, pr-review
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#   open http://localhost:3000/ui

x-app-env: &app-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/agents
  RENDER_FACTORY_API_KEY: ${RENDER_FACTORY_API_KEY:-dev-key}
  RENDER_FACTORY_ENCRYPTION_KEY: ${RENDER_FACTORY_ENCRYPTION_KEY:-dev-only-change-me-0000000000000000}
  RENDER_FACTORY_STRICT_APPROVAL: ${RENDER_FACTORY_STRICT_APPROVAL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agents
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    image: render-factory:latest
    command: ["pnpm", "--filter", "@render-factory/app", "start"]
    ports:
      - "${GATEWAY_HOST_PORT:-3010}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "3000"

  workflows:
    build: .
    image: render-factory:latest
    command: ["pnpm", "--filter", "@render-factory/app", "workflows"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env

volumes:
  pgdata:
