# Render Blueprint for the GitHub agent demo (examples/demo).
#
# Two pipelines, triggered by one webhook at POST /webhooks/github:
#   issue-to-pr  (issues, issue_comment): triage -> Research/Plan/Implement -> PR
#   pr-review    (pull_request): fan out 4 reviewers -> judge -> approve/request-changes
#
# ┌─ Render Blueprints CANNOT create/manage Workflow services yet ─────────────┐
# │ This file provisions the gateway (web) + Postgres + crons. The durable      │
# │ "Lane A" Workflow service that runs the pipelines (and the reviewer fan-out  │
# │ as isolated agent@standard tasks) must be created MANUALLY in the Dashboard  │
# │ (New > Workflow, Language = Docker). See examples/demo/README.md → Deploy.   │
# │                                                                             │
# │ The Workflow SLUG is defined in CODE (examples/demo/src/lib/render.ts), so   │
# │ neither service needs a RENDER_WORKFLOW_SLUG env var — just name the         │
# │ Workflow service `render-agents-demo-workflows` to match the constant (or    │
# │ edit the constant / set RENDER_WORKFLOW_SLUG, which wins).                   │
# │                                                                             │
# │ Both the gateway (to trigger the root) and the Workflow service (to trigger  │
# │ the reviewer fan-out) call the Render task API, so BOTH need RENDER_API_KEY  │
# │ (a Render API key, rnd_…). Until it's set on the gateway, the gateway runs   │
# │ workflows in-process — OK for pr-review, but issue-to-pr can exceed GitHub's │
# │ ~10s webhook timeout, so Lane A is strongly recommended.                     │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# All services build the repo-root Dockerfile (which installs git + the Node
# toolchain). Point one GitHub webhook (Issues, Issue comments, Pull requests)
# at https://<gateway-url>/webhooks/github with GITHUB_WEBHOOK_SECRET.

databases:
  - name: render-agents-demo-db
    plan: basic-256mb

services:
  # --- Gateway (web): webhook ingress + trigger surface + SSE + /ui ---
  - type: web
    name: render-agents-demo-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: pnpm --filter @render-agents/example-demo start
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: render-agents-demo-db
          property: connectionString
      - key: RENDER_AGENTS_API_KEY
        generateValue: true
      - key: RENDER_AGENTS_ENCRYPTION_KEY
        generateValue: true
      # Lane A: paste a Render API key (rnd_…) so the gateway can startTask the
      # workflow root. Empty => in-process drive (fallback). (Slug is in code.)
      - key: RENDER_API_KEY
        sync: false
      # The gateway verifies inbound webhook signatures.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Only used if the gateway runs a workflow IN-PROCESS (before Lane A is on).
      # In Lane A these live on the Workflow service instead.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_BOT_LOGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GIT_AUTHOR_NAME
        value: render-agent
      - key: GIT_AUTHOR_EMAIL
        value: render-agent@users.noreply.github.com

  # --- Daily retention cleanup ---
  - type: cron
    name: render-agents-demo-retention
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "0 4 * * *"
    dockerCommand: sh -c 'curl -fsS -X POST "$GATEWAY_URL/admin/retention" -H "Authorization: Bearer $RENDER_AGENTS_API_KEY"'
    envVars:
      - key: GATEWAY_URL
        fromService:
          type: web
          name: render-agents-demo-gateway
          property: hostport
      - key: RENDER_AGENTS_API_KEY
        fromService:
          type: web
          name: render-agents-demo-gateway
          envVarKey: RENDER_AGENTS_API_KEY

  # --- Stranded-run reaper (fails Lane A roots stranded by a lost task) ---
  - type: cron
    name: render-agents-demo-reaper
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "*/5 * * * *"
    dockerCommand: sh -c 'curl -fsS -X POST "$GATEWAY_URL/admin/runs/reap" -H "Authorization: Bearer $RENDER_AGENTS_API_KEY"'
    envVars:
      - key: GATEWAY_URL
        fromService:
          type: web
          name: render-agents-demo-gateway
          property: hostport
      - key: RENDER_AGENTS_API_KEY
        fromService:
          type: web
          name: render-agents-demo-gateway
          envVarKey: RENDER_AGENTS_API_KEY

# --- Create this MANUALLY in the Dashboard (Blueprints can't manage Workflows) ---
# New > Workflow:
#   Name:            render-agents-demo-workflows   (must match WORKFLOW_SLUG in
#                                                     src/lib/render.ts)
#   Repo:            this repo/branch
#   Language:        Docker
#   Dockerfile Path: ./Dockerfile
#   Start Command:   pnpm --filter @render-agents/example-demo workflows
#   Instance type:   standard (headroom for clone + build + tests)
#   Environment variables (the slug is in code, so no RENDER_WORKFLOW_SLUG here):
#     DATABASE_URL                 = render-agents-demo-db Internal Database URL (same DB)
#     RENDER_AGENTS_ENCRYPTION_KEY = same value as the gateway (reveal + copy)
#     RENDER_API_KEY               = a Render API key (rnd_…) — needed to runTask
#                                    the reviewer fan-out (agent@standard) children
#     GITHUB_TOKEN                 = fine-grained PAT (Contents/PRs/Issues RW)
#     GITHUB_BOT_LOGIN             = the PAT account login (loop guard)
#     ANTHROPIC_API_KEY            = provider key
#     GIT_AUTHOR_NAME              = render-agent
#     GIT_AUTHOR_EMAIL             = render-agent@users.noreply.github.com
