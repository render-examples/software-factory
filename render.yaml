databases:
  - name: render-factory-db
    plan: basic-256mb

services:
  - type: web
    name: render-factory-gateway
    runtime: docker
    plan: starter
    preDeployCommand: npm run db:migrate
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: render-factory-db
          property: connectionString
      - key: FACTORY_REPO
        sync: false
      - key: FACTORY_LABEL
        value: factory
      - key: FACTORY_GITHUB_ACTORS
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: render-factory-retention
    runtime: docker
    plan: starter
    schedule: "0 4 * * *"
    dockerCommand: npm run db:cleanup
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: render-factory-db
          property: connectionString
