databases:
  - name: factory-db
    plan: basic-256mb

services:
  - type: web
    name: factory-gateway
    runtime: docker
    plan: starter
    preDeployCommand: npm run db:migrate
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: factory-db
          property: connectionString
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: FACTORY_ADMIN_TOKEN
        generateValue: true

  - type: worker
    name: factory-dispatcher
    runtime: docker
    plan: starter
    dockerCommand: node --import tsx app/src/dispatcher.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: factory-db
          property: connectionString
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          name: factory-workflows
          type: workflow
          property: slug

  - type: workflow
    name: factory-workflows
    runtime: node
    region: oregon
    repo: https://github.com/render-examples/code-factory-demo.git
    buildCommand: npm ci
    startCommand: npm run start:workflows
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: factory-db
          property: connectionString

  - type: cron
    name: factory-maintenance
    runtime: docker
    schedule: "* * * * *"
    dockerCommand: node --import tsx app/src/maintenance.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: factory-db
          property: connectionString
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKSPACE_ID
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        sync: false
