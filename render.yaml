services:
  - type: web
    name: render-factory-gateway
    runtime: docker
    plan: starter
    healthCheckPath: /ready
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: render-factory-kv
          property: connectionString
      - key: FACTORY_REPO
        sync: false
      - key: FACTORY_LABEL
        value: factory
      - key: FACTORY_GITHUB_ACTORS
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

  - type: keyvalue
    name: render-factory-kv
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
