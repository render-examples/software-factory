# The gateway and its database.
#
# The Workflows service is not created here — Render Workflows services are
# created separately with `npm run start:workflows`. Give it the same
# DATABASE_URL (the database's internal connection string) as the gateway.

databases:
  - name: render-factory-db
    plan: basic-256mb

services:
  - type: web
    name: render-factory-gateway
    runtime: docker
    plan: starter
    # Applies app/sql before any new instance serves traffic.
    preDeployCommand: npm run db:migrate
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: render-factory-db
          property: connectionString
      - key: FACTORY_REPO
        sync: false
      - key: FACTORY_LABEL
        value: factory
      - key: FACTORY_GITHUB_ACTORS
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Used by the Render SDK to start the workflow task.
      - key: RENDER_API_KEY
        sync: false
