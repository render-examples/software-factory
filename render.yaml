services:
  - type: web
    name: render-factory-gateway
    runtime: docker
    plan: starter
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: render-factory-kv
          property: connectionString
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

  - type: keyvalue
    name: render-factory-kv
    plan: starter
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
