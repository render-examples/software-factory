projects:
  - name: software-factory
    environments:
      - name: production
        services:
          - type: web
            name: factory-gateway
            region: oregon
            runtime: node
            plan: starter
            buildCommand: npm ci
            startCommand: npm run start:gateway
            healthCheckPath: /ready
            envVars:
              - fromGroup: software-factory-shared
              - fromGroup: software-factory-gateway
              - key: RENDER_WORKFLOW_SLUG
                fromService:
                  type: workflow
                  name: factory-workflows
                  property: slug
              - key: DATABASE_URL
                fromDatabase:
                  name: factory-db
                  property: connectionString

          - type: workflow
            name: factory-workflows
            region: oregon
            runtime: node
            buildCommand: npm ci
            startCommand: npm run start:workflows
            envVars:
              - fromGroup: software-factory-shared
              - fromGroup: software-factory-workflows

        databases:
          - name: factory-db
            region: oregon
            plan: basic-256mb
            postgresMajorVersion: "17"
