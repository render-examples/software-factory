# software-factory: two services in a software-factory project.
# - factory-gateway: verifies GitHub webhooks and starts the matching Workflows task.
# - factory-workflows: runs every task (agents, snapshot refresh, cancel). It has no `repo` field, so it
#   deploys from the same repository as this Blueprint, including forks.
# Run and agent telemetry is logged as JSON lines; find it in each service's logs or a log stream.
#
# Secrets live in three environment groups that `npm run setup:render` creates from .env before this
# Blueprint is applied. Blueprint groups can't hold `sync: false` values, so the groups are not defined here.
# The gateway links no group that holds GitHub App credentials or a model key.

projects:
  - name: software-factory
    environments:
      - name: production
        services:
          - type: web
            name: factory-gateway
            region: oregon
            runtime: node
            plan: starter
            buildCommand: npm ci
            startCommand: npm run start:gateway
            healthCheckPath: /ready
            envVars:
              - fromGroup: software-factory-shared
              - fromGroup: software-factory-gateway
              - key: RENDER_WORKFLOW_SLUG
                fromService:
                  type: workflow
                  name: factory-workflows
                  property: slug

          - type: workflow
            name: factory-workflows
            region: oregon
            runtime: node
            buildCommand: npm ci
            startCommand: npm run start:workflows
            envVars:
              - fromGroup: software-factory-shared
              - fromGroup: software-factory-workflows
