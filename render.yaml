# software-factory: two services and a database in a software-factory project.
# - factory-gateway: verifies GitHub webhooks and starts the matching Workflows task.
# - factory-workflows: runs every task (agents, snapshot refresh, cancel). It has no `repo` field, so it
#   deploys from the same repository as this Blueprint, including forks.
# - factory-db: the event log. Both services apply its migrations at startup. It is a paid instance because
#   free databases expire after 30 days.
# Deliveries, claims, task runs, and agent runs are recorded in factory-db; the gateway streams agent runs live.
#
# Secrets live in three environment groups that `npm run setup:render` creates from .env before this
# Blueprint is applied. Blueprint groups can't hold `sync: false` values, so the groups are not defined here.
# The gateway links no group that holds GitHub App credentials or a model key.

projects:
  - name: software-factory
    environments:
      - name: production
        services:
          - type: web
            name: factory-gateway
            region: oregon
            runtime: node
            plan: starter
            buildCommand: npm ci
            startCommand: npm run start:gateway
            healthCheckPath: /ready
            envVars:
              - fromGroup: software-factory-shared
              - fromGroup: software-factory-gateway
              - key: RENDER_WORKFLOW_SLUG
                fromService:
                  type: workflow
                  name: factory-workflows
                  property: slug
              - key: DATABASE_URL
                fromDatabase:
                  name: factory-db
                  property: connectionString

          - type: workflow
            name: factory-workflows
            region: oregon
            runtime: node
            buildCommand: npm ci
            startCommand: npm run start:workflows
            envVars:
              - fromGroup: software-factory-shared
              - fromGroup: software-factory-workflows
              - key: DATABASE_URL
                fromDatabase:
                  name: factory-db
                  property: connectionString

        databases:
          - name: factory-db
            region: oregon
            plan: basic-256mb
            postgresMajorVersion: "17"
