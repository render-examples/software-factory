services:
  - type: web
    name: factory-gateway
    runtime: docker
    plan: starter
    envVars:
      - key: REDIS_URL
        fromKeyValue:
          name: factory-kv
          property: connectionString
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

  # factory-workflows is a Render Workflow service (managed in the Dashboard,
  # not via Blueprint). Start command: npx tsx app/src/workflows.ts

keyValues:
  - name: factory-kv
    plan: starter
