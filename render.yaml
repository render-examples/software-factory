# Software Factory: three resources.
# - factory-db: Postgres holding the append-only events table. Strict run claims coordinate stages; other rows are telemetry.
# - factory-gateway: verifies GitHub webhooks and starts the matching Workflows task. Migrations run before each deploy.
# - factory-workflows: runs every task (stages, agents, snapshot refresh, cancel). It has no `repo` field, so it
#   deploys from the same repository as this Blueprint, including forks.

databases:
  - name: factory-db
    region: oregon
    plan: basic-256mb

services:
  - type: web
    name: factory-gateway
    region: oregon
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start:gateway
    preDeployCommand: npm run db:migrate
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: factory-db
          property: connectionString
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: factory-workflows
          property: slug

  - type: workflow
    name: factory-workflows
    region: oregon
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start:workflows
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: factory-db
          property: connectionString
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKSPACE_ID
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
