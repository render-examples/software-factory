name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 = floor (pnpm 11 requires >=22.13), 24 = active LTS, 26 = the pinned dev line (.nvmrc).
        node-version: [22, 24, 26]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify declared dependencies are materialized
        # Guards against a partial/stale store where a package's declared deps
        # (e.g. create-render-factory' @clack/prompts) never get linked, which
        # otherwise surfaces only as a confusing tsc TS2307 at build time.
        run: pnpm -r exec node -e "for (const d of Object.keys({...(require('./package.json').dependencies||{})})) require.resolve(d)"

      - name: Build
        run: pnpm turbo run build

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Bundle-size gate (sdk < 100KB)
        run: pnpm check:bundle-size

      - name: Test
        run: pnpm turbo run test
        env:
          # Exercises the memory↔Postgres parity suite (skipped when unset).
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agents_test

      - name: Verify dependency graph
        run: |
          # Ensure engine/store never import from sdk (guards acyclic graph)
          if grep -r "from ['\"]@render-factory/sdk" packages/engine/src/ packages/store/src/ 2>/dev/null; then
            echo "ERROR: engine or store must not import from sdk"
            exit 1
          fi
          # Ensure store never imports from engine
          if grep -r "from ['\"]@render-factory/engine" packages/store/src/ 2>/dev/null; then
            echo "ERROR: store must not import from engine"
            exit 1
          fi
          echo "Dependency graph check passed"
