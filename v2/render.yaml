services:
  - type: web
    name: factory-gateway
    runtime: node
    plan: starter
    buildCommand: cd v2 && npm install
    startCommand: cd v2 && npx tsx app/src/server.ts
    envVars:
      - key: REDIS_URL
        fromKeyValue:
          name: factory-kv
          property: connectionString
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: factory-workflows
    runtime: node
    plan: standard
    buildCommand: cd v2 && npm install
    startCommand: cd v2 && npx tsx app/src/workflows.ts
    envVars:
      - key: REDIS_URL
        fromKeyValue:
          name: factory-kv
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

keyValues:
  - name: factory-kv
    plan: starter
